name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check the tag matches the POM version
        run: |
          version=$(sed -n 's|^  <version>\(.*\)</version>|\1|p' pom.xml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom.xml version $version"
            exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - run: mvn --batch-mode verify --projects nailgun-server --also-make

  # Google trusts only this job: the `release` environment, which runs on `v*` tags alone. The
  # tests ran above, without the token; here nothing but Maven's own build runs while it exists.
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          server-id: artifact-registry
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/550793476644/locations/global/workloadIdentityPools/nailgun/providers/github-actions
          service_account: nailgun-publisher@syb-common-images.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Publish nailgun-server and its parent POM
        run: mvn --batch-mode deploy --projects nailgun-server --also-make -DskipTests
        env:
          MAVEN_USERNAME: oauth2accesstoken
          MAVEN_PASSWORD: ${{ steps.auth.outputs.access_token }}
